<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🐛 지렁이 키우기</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{font-family:Arial,"Noto Sans KR",sans-serif;background:#07110a;color:#fff}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;background:linear-gradient(#102c18,#07110a)}
#top{height:76px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:#0c2112;border-bottom:1px solid #29452d}
.brand{font-size:23px;font-weight:900}.hint{font-size:11px;color:#91a994;margin-top:3px}
.stats{display:flex;gap:10px}.stat{min-width:70px;text-align:center;background:#132c19;border:1px solid #315538;border-radius:13px;padding:7px 10px}
.stat small{display:block;font-size:9px;color:#8fa493}.stat b{font-size:21px}
#main{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
#board{position:relative;width:min(calc(100vw - 16px),calc(100vh - 150px));height:min(calc(100vw - 16px),calc(100vh - 150px));max-width:760px;max-height:760px;background:#0a1b0d;border:2px solid #31583a;border-radius:18px;overflow:hidden;box-shadow:0 18px 55px #0009}
canvas{display:block;width:100%;height:100%}
#controls{height:132px;flex:none;display:grid;grid-template-columns:repeat(3,68px);grid-template-rows:58px 58px;gap:6px;justify-content:center;padding:8px 0}
.control{border:1px solid #365d3d;border-radius:15px;background:#132b18;color:white;font-size:26px;font-weight:900;box-shadow:0 6px 15px #0006;touch-action:manipulation}
.control:active{transform:scale(.94);background:#24502c}
#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#041008d9;z-index:10}
.card{width:min(430px,88%);padding:30px 24px;text-align:center;background:#102419f7;border:1px solid #ffffff1b;border-radius:24px;box-shadow:0 25px 70px #000a}
.card h1{font-size:40px;margin:5px 0 10px}.card p{color:#b5c7b8;line-height:1.6}
button.start{margin-top:10px;padding:14px 28px;border:0;border-radius:14px;background:linear-gradient(135deg,#75e17e,#35b85d);font-size:16px;font-weight:900;color:#061009;cursor:pointer}
.hidden{display:none!important}

/* Worm Customizer */
#customizeBtn{position:fixed;right:14px;top:14px;z-index:50;border:0;border-radius:14px;padding:9px 12px;background:rgba(255,255,255,.16);color:#fff;font-weight:800;cursor:pointer;backdrop-filter:blur(8px);pointer-events:auto;touch-action:manipulation;z-index:50}
#customizer{position:fixed;inset:0;background:rgba(0,0,0,.58);display:none;align-items:center;justify-content:center;z-index:30;padding:18px}
#customizer.open{display:flex;pointer-events:auto}
.custom-card{position:relative;z-index:31;pointer-events:auto;width:min(430px,94vw);max-height:90vh;overflow:auto;background:#18251f;border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:20px;box-shadow:0 24px 70px rgba(0,0,0,.45)}
.custom-card h2{margin:0 0 5px;font-size:22px}.custom-sub{margin:0 0 18px;color:#b8c7c0;font-size:13px}
.custom-row{margin:15px 0}.custom-row label{display:block;font-weight:800;margin-bottom:8px}
.swatches{display:flex;gap:9px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.25)}.swatch.active{border-color:#fff;transform:scale(1.08)}
.custom-select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid #44564e;background:#101914;color:#fff;font-weight:700}
.custom-buttons{display:flex;gap:10px;margin-top:18px}.custom-buttons button{flex:1;border:0;border-radius:13px;padding:12px;font-weight:900;cursor:pointer}.save-custom{background:#8ee35b;color:#10200e}.close-custom{background:#2d3b35;color:#fff}

</style>
</head>
<body>
<div id="customizer" aria-hidden="true">
  <div class="custom-card">
    <h2>🐛 지렁이 꾸미기</h2>
    <p class="custom-sub">원하는 색상과 모습을 골라 나만의 지렁이를 만들어 보세요.</p>
    <div class="custom-row">
      <label>몸 색상</label>
      <div class="swatches" id="bodyColors">
        <button type="button" class="swatch" data-color="#66e34f" style="background:#66e34f"></button>
        <button type="button" class="swatch" data-color="#39c5ff" style="background:#39c5ff"></button>
        <button type="button" class="swatch" data-color="#a875ff" style="background:#a875ff"></button>
        <button type="button" class="swatch" data-color="#ff5b78" style="background:#ff5b78"></button>
        <button type="button" class="swatch" data-color="#ffd447" style="background:#ffd447"></button>
        <button type="button" class="swatch" data-color="#ff8b3d" style="background:#ff8b3d"></button>
        <button type="button" class="swatch" data-color="#ffffff" style="background:#fff"></button>
      </div>
    </div>
    <div class="custom-row">
      <label>무늬</label>
      <select id="patternSelect" class="custom-select">
        <option value="solid">기본</option>
        <option value="stripe">줄무늬</option>
        <option value="dot">점박이</option>
        <option value="rainbow">무지개</option>
        <option value="neon">네온</option>
      </select>
    </div>
    <div class="custom-row">
      <label>눈 모양</label>
      <select id="eyeSelect" class="custom-select">
        <option value="normal">동그란 눈</option>
        <option value="happy">행복한 눈</option>
        <option value="big">큰 눈</option>
        <option value="star">별 눈</option>
      </select>
    </div>
    <div class="custom-row">
      <label>머리 장식</label>
      <select id="accessorySelect" class="custom-select">
        <option value="none">없음</option>
        <option value="crown">왕관 👑</option>
        <option value="cap">모자 🧢</option>
        <option value="flower">꽃 🌸</option>
        <option value="star">별 ⭐</option>
      </select>
    </div>
    <div class="custom-buttons">
      <button type="button" class="close-custom" id="closeCustomizer" onclick="var w=document.getElementById('customizer'); w.classList.remove('open'); w.setAttribute('aria-hidden','true');">닫기</button>
      <button type="button" class="save-custom" id="saveCustomizer" onclick="localStorage.setItem('wormBody',document.querySelector('#bodyColors .swatch.active')?.dataset.color||'#66e34f'); localStorage.setItem('wormPattern',document.getElementById('patternSelect').value); localStorage.setItem('wormEyes',document.getElementById('eyeSelect').value); localStorage.setItem('wormAccessory',document.getElementById('accessorySelect').value); location.reload();">적용하기</button>
    </div>
  </div>
</div>

<div id="app">
<header id="top">
<button type="button" id="customizeBtn" aria-label="지렁이 꾸미기" onclick="var w=document.getElementById('customizer'); w.classList.add('open'); w.setAttribute('aria-hidden','false');">🎨 꾸미기</button>
  <div><div class="brand">🐛 지렁이 키우기</div><div class="hint">먹이를 먹고 몸을 길게 키워보세요!</div></div>
  <div class="stats">
    <div class="stat"><small>길이</small><b id="length">3</b></div>
    <div class="stat"><small>점수</small><b id="score">0</b></div>
    <div class="stat"><small>최고</small><b id="best">0</b></div>
  </div>
</header>

<main id="main">
  <div id="board">
    <canvas id="canvas"></canvas>
    <div id="overlay" class="overlay">
      <div class="card">
        <div style="color:#76e481;font-size:12px;font-weight:900;letter-spacing:2px">WORM GROW</div>
        <h1>🐛 지렁이 키우기</h1>
        <p>빨간 먹이를 먹을수록<br><b>지렁이가 길어지고 빨라집니다!</b></p>
        <p style="font-size:12px">PC: 방향키 / WASD<br>모바일: 방향 버튼</p>
        <button class="start" id="start">키우기 시작</button>
      </div>
    </div>
  </div>
</main>

<div id="controls">
  <button class="control" id="up">▲</button>
  <button class="control" id="left">◀</button>
  <button class="control" id="down">▼</button>
  <button class="control" id="right">▶</button>
</div>
</div>

<script>
const wormStyle = {
  body: localStorage.getItem('wormBody') || '#66e34f',
  pattern: localStorage.getItem('wormPattern') || 'solid',
  eyes: localStorage.getItem('wormEyes') || 'normal',
  accessory: localStorage.getItem('wormAccessory') || 'none'
};
function hexRgb(hex){
  const n=parseInt(hex.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255];
}
function wormFill(ctx,x,y,r,i){
  const [rr,gg,bb]=hexRgb(wormStyle.body);
  if(wormStyle.pattern==='rainbow'){
    const hue=(i*42)%360; ctx.fillStyle=`hsl(${hue} 82% 58%)`;
  } else if(wormStyle.pattern==='neon'){
    ctx.fillStyle=`rgb(${Math.min(255,rr+35)},${Math.min(255,gg+35)},${Math.min(255,bb+35)})`;
  } else {
    ctx.fillStyle=wormStyle.body;
  }
  ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
  if(wormStyle.pattern==='stripe' && i%2===0){
    ctx.fillStyle='rgba(255,255,255,.28)'; ctx.beginPath(); ctx.arc(x,y,r*.62,0,Math.PI*2); ctx.fill();
  }
  if(wormStyle.pattern==='dot' && i%2===0){
    ctx.fillStyle='rgba(255,255,255,.42)'; ctx.beginPath(); ctx.arc(x-r*.22,y-r*.12,r*.16,0,Math.PI*2); ctx.fill();
  }
}
function drawCustomEyes(ctx,x,y,r,dir){
  const ex = dir.x ? dir.x*r*.32 : r*.12;
  const ey = dir.y ? dir.y*r*.32 : -r*.32;
  if(wormStyle.eyes==='happy'){
    ctx.strokeStyle='#172018';ctx.lineWidth=Math.max(2,r*.11);
    [-1,1].forEach(s=>{ctx.beginPath();ctx.arc(x+ex+s*r*.27,y+ey,r*.18,Math.PI*.15,Math.PI*.85);ctx.stroke()});
  } else {
    const size=wormStyle.eyes==='big'?r*.22:r*.16;
    for(const s of [-1,1]){
      const ox=x+ex+s*r*.28, oy=y+ey;
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ox,oy,size,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#172018';ctx.beginPath();ctx.arc(ox+dir.x*size*.22,oy+dir.y*size*.22,size*.48,0,Math.PI*2);ctx.fill();
      if(wormStyle.eyes==='star'){
        ctx.fillStyle='#ffd447';ctx.font=`${size*2.2}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('★',ox,oy);
      }
    }
  }
}
function drawAccessory(ctx,x,y,r){
  ctx.textAlign='center';ctx.textBaseline='middle';
  const a=wormStyle.accessory;
  if(a==='crown'){ctx.font=`${r*1.25}px serif`;ctx.fillText('👑',x,y-r*.82)}
  if(a==='cap'){ctx.font=`${r*1.2}px serif`;ctx.fillText('🧢',x,y-r*.78)}
  if(a==='flower'){ctx.font=`${r*1.05}px serif`;ctx.fillText('🌸',x+r*.58,y-r*.62)}
  if(a==='star'){ctx.fillStyle='#ffd447';ctx.font=`${r*.9}px sans-serif`;ctx.fillText('★',x,y-r*.78)}
}
function applyCustomizer(){
  localStorage.setItem('wormBody',wormStyle.body);
  localStorage.setItem('wormPattern',wormStyle.pattern);
  localStorage.setItem('wormEyes',wormStyle.eyes);
  localStorage.setItem('wormAccessory',wormStyle.accessory);
}

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const board=document.getElementById("board");

const N=14;
let W=0,H=0,D=1,C=1;
let snake=[],food={x:3,y:3};
let dir={x:1,y:0},queued={x:1,y:0};
let score=0,best=Number(localStorage.wormGrowBest||0);
let running=false,acc=0,last=0,speed=135;
let particles=[],foodAnim=0,shake=0;

function resize(){
  const r=board.getBoundingClientRect();
  D=Math.min(devicePixelRatio||1,2);
  W=r.width;H=r.height;
  canvas.width=W*D;canvas.height=H*D;
  ctx.setTransform(D,0,0,D,0,0);
  C=Math.min(W,H)/N;
}
addEventListener("resize",resize);
resize();

function updateHud(){
  document.getElementById("length").textContent=snake.length;
  document.getElementById("score").textContent=score;
  document.getElementById("best").textContent=best;
}

function newGame(){
  snake=[
    {x:7,y:7},{x:6,y:7},{x:5,y:7},{x:4,y:7},{x:3,y:7}
  ];
  dir={x:1,y:0};queued={x:1,y:0};
  score=0;speed=260;acc=0;particles=[];shake=0;
  placeFood();
  running=true;
  document.getElementById("overlay").classList.add("hidden");
  updateHud();
}

function placeFood(){
  do{
    food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)};
  }while(snake.some(s=>s.x===food.x&&s.y===food.y));
}

function changeDirection(x,y){
  if(!running)return;
  if(x===-dir.x&&y===-dir.y)return;
  queued={x,y};
}

function eatEffect(){
  const fx=food.x*C+C/2,fy=food.y*C+C/2;
  for(let i=0;i<18;i++){
    const a=Math.random()*Math.PI*2;
    const v=1+Math.random()*3;
    particles.push({x:fx,y:fy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,a:1,s:3+Math.random()*4});
  }
}

function move(){
  dir=queued;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

  if(head.x<0||head.x>=N||head.y<0||head.y>=N){
    gameOver("벽에 부딪혔어요!");
    return;
  }

  const eating=head.x===food.x&&head.y===food.y;
  const check=eating?snake:snake.slice(0,-1);
  if(check.some(s=>s.x===head.x&&s.y===head.y)){
    gameOver("자기 몸에 부딪혔어요!");
    return;
  }

  snake.unshift(head);

  if(eating){
    score++;
    speed=Math.max(85,260-score*8);
    eatEffect();
    placeFood();
    if(score>best){
      best=score;
      localStorage.wormGrowBest=best;
    }
    updateHud();
  }else{
    snake.pop();
  }
}

function gameOver(msg){
  running=false;
  document.getElementById("overlay").innerHTML=`
    <div class="card">
      <div style="color:#ff9075;font-size:12px;font-weight:900;letter-spacing:2px">GAME OVER</div>
      <h1>🐛 ${score}점</h1>
      <p>${msg}</p>
      <p>지렁이 길이 <b>${snake.length}</b> · 최고 점수 <b>${best}</b></p>
      <button class="start" id="again">다시 키우기</button>
    </div>`;
  document.getElementById("overlay").classList.remove("hidden");
  document.getElementById("again").onclick=newGame;
}

function roundedRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

function draw(){
  ctx.clearRect(0,0,W,H);

  // Background
  ctx.fillStyle="#08170b";
  ctx.fillRect(0,0,W,H);

  // Large clean grid
  ctx.strokeStyle="#17351e";
  ctx.lineWidth=1;
  for(let i=0;i<=N;i++){
    ctx.beginPath();ctx.moveTo(i*C,0);ctx.lineTo(i*C,N*C);ctx.stroke();
    ctx.beginPath();ctx.moveTo(0,i*C);ctx.lineTo(N*C,i*C);ctx.stroke();
  }

  // Subtle glow in center
  const glow=ctx.createRadialGradient(W/2,H/2,10,W/2,H/2,W*.7);
  glow.addColorStop(0,"#17391e22");glow.addColorStop(1,"#00000000");
  ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  // Food: big red apple/berry
  foodAnim+=0.08;
  const pulse=1+Math.sin(foodAnim)*0.07;
  const fx=food.x*C+C/2,fy=food.y*C+C/2;
  ctx.save();
  ctx.translate(fx,fy);ctx.scale(pulse,pulse);
  ctx.shadowColor="#ff3f45";ctx.shadowBlur=24;
  ctx.fillStyle="#ff4148";
  ctx.beginPath();ctx.arc(-C*.12,0,C*.30,0,Math.PI*2);ctx.arc(C*.12,0,C*.30,0,Math.PI*2);ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle="#ff7272";ctx.beginPath();ctx.arc(-C*.14,-C*.13,C*.09,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle="#69b95e";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,-C*.25);ctx.quadraticCurveTo(C*.04,-C*.4,C*.16,-C*.32);ctx.stroke();
  ctx.restore();

  // Worm
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i],px=s.x*C+C/2,py=s.y*C+C/2;
    const r=C*.49;
    ctx.save();
    ctx.translate(px,py);
    ctx.shadowColor=i===0?wormStyle.body:"rgba(40,180,80,.75)";
    ctx.shadowBlur=i===0?18:7;
    wormFill(ctx,0,0,r,i);
    ctx.shadowBlur=0;
    ctx.fillStyle="#ffffff";ctx.globalAlpha=.25;
    ctx.beginPath();ctx.arc(-r*.25,-r*.25,r*.23,0,Math.PI*2);ctx.fill();
    ctx.globalAlpha=1;
    if(i===0){
      drawCustomEyes(ctx,0,0,r,dir);
      drawAccessory(ctx,0,0,r);
    }
    ctx.restore();
  }

  // Eat particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.vy*=.98;p.a-=.035;
    ctx.globalAlpha=Math.max(0,p.a);
    ctx.fillStyle="#ffcf55";
    ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,Math.PI*2);ctx.fill();
    if(p.a<=0)particles.splice(i,1);
  }
  ctx.globalAlpha=1;
}

function loop(t){
  const dt=t-last;last=t;
  if(running){
    acc+=dt;
    if(acc>=speed){acc-=speed;move()}
  }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const keys={
  ArrowUp:[0,-1],w:[0,-1],W:[0,-1],
  ArrowDown:[0,1],s:[0,1],S:[0,1],
  ArrowLeft:[-1,0],a:[-1,0],A:[-1,0],
  ArrowRight:[1,0],d:[1,0],D:[1,0]
};
addEventListener("keydown",e=>{
  if(keys[e.key]){e.preventDefault();changeDirection(...keys[e.key])}
});

document.getElementById("up").onpointerdown=()=>changeDirection(0,-1);
document.getElementById("down").onpointerdown=()=>changeDirection(0,1);
document.getElementById("left").onpointerdown=()=>changeDirection(-1,0);
document.getElementById("right").onpointerdown=()=>changeDirection(1,0);
document.getElementById("start").onclick=newGame;

const customizer=document.getElementById('customizer');
if(!customizer) throw new Error('꾸미기 창을 찾을 수 없습니다.');
const customizeBtn=document.getElementById('customizeBtn');
const closeCustomizer=document.getElementById('closeCustomizer');
const saveCustomizer=document.getElementById('saveCustomizer');
const patternSelect=document.getElementById('patternSelect');
const eyeSelect=document.getElementById('eyeSelect');
const accessorySelect=document.getElementById('accessorySelect');
function syncCustomizerUI(){
  document.querySelectorAll('#bodyColors .swatch').forEach(b=>b.classList.toggle('active',b.dataset.color===wormStyle.body));
  patternSelect.value=wormStyle.pattern; eyeSelect.value=wormStyle.eyes; accessorySelect.value=wormStyle.accessory;
}
if(customizeBtn){
  customizeBtn.addEventListener('click',function(ev){
    ev.preventDefault();
    ev.stopPropagation();
    syncCustomizerUI();
    customizer.classList.add('open');
    customizer.setAttribute('aria-hidden','false');
  });
}
closeCustomizer?.addEventListener('click',()=>{customizer.classList.remove('open');customizer.setAttribute('aria-hidden','true');});
document.querySelectorAll('#bodyColors .swatch').forEach(b=>b.addEventListener('click',()=>{wormStyle.body=b.dataset.color;syncCustomizerUI();}));
patternSelect?.addEventListener('change',e=>wormStyle.pattern=e.target.value);
eyeSelect?.addEventListener('change',e=>wormStyle.eyes=e.target.value);
accessorySelect?.addEventListener('change',e=>wormStyle.accessory=e.target.value);
saveCustomizer?.addEventListener('click',()=>{applyCustomizer();customizer.classList.remove('open');customizer.setAttribute('aria-hidden','true');});
customizer?.addEventListener('click',e=>{if(e.target===customizer)customizer.classList.remove('open');});
</script>



</body>
</html>
