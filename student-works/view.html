<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎨 학생 작품 · AI 제작반 부스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; background: #fff; font-family: 'Noto Sans KR', sans-serif; }
  /* 위쪽 배너: 학생 작품 HTML은 건드리지 않고 아래 iframe에 그대로 띄움 */
  .bar {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 8px 12px; min-height: 52px;
    background: linear-gradient(135deg, #667eea, #764ba2); color: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.2); z-index: 1;
  }
  .home {
    flex: none; font-family: 'Jua', sans-serif; font-size: 1.05rem;
    background: #fff; color: #6a4fd8; text-decoration: none;
    padding: 7px 14px; border-radius: 999px;
  }
  .info { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  .info small { font-weight: 500; opacity: .85; margin-left: 6px; }
  .newtab { flex: none; color: #fff; opacity: .8; font-size: .85rem; text-decoration: none; }
  .newtab:hover { opacity: 1; text-decoration: underline; }
  iframe { flex: 1; width: 100%; border: 0; display: block; }
  .missing { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: #6b6580; font-size: 1.1rem; }
  @media (max-width: 480px) { .newtab { display: none; } }
</style>
</head>
<body>
<div class="bar">
  <a class="home" href="../">🏠 허브로</a>
  <div class="info" id="info">🎨 학생 작품</div>
  <a class="newtab" id="newtab" target="_blank" rel="noopener">새 창으로 ↗</a>
</div>
<iframe id="work" title="학생 작품"
  allow="camera; microphone; fullscreen; autoplay; clipboard-write; gamepad"
  allowfullscreen></iframe>

<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const slug = new URLSearchParams(location.search).get('w') || '';

if (!/^[a-z0-9-]+$/i.test(slug)) {
  document.getElementById('work').outerHTML = '<div class="missing">😵 작품을 찾을 수 없어요<a class="home" href="../" style="background:#6a4fd8;color:#fff">🏠 허브로</a></div>';
  document.getElementById('newtab').remove();
} else {
  const src = slug + '/';
  document.getElementById('work').src = src;
  document.getElementById('newtab').href = src;
  fetch('works.json?t=' + Date.now())
    .then(r => r.ok ? r.json() : [])
    .then(list => {
      const w = (Array.isArray(list) ? list : []).find(x => x && x.slug === slug);
      if (!w) return;
      document.getElementById('info').innerHTML = `${esc(w.emoji || '🎨')} ${esc(w.title)}<small>${w.sid ? esc(w.sid) + ' ' : ''}${esc(w.author)}</small>`;
      document.title = `${w.emoji || '🎨'} ${w.title} · AI 제작반 부스`;
    })
    .catch(() => {});
}
</script>
</body>
</html>
