<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ff6b35" />
<link rel="icon" href="data:," />
<title>AI 진짜? 가짜? 퀴즈</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;min-height:100%}
body{font-family:"Arial Rounded MT Bold","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:linear-gradient(160deg,#fff8e8,#ffe9c7 60%,#ffd9a8);color:#16213e;
  min-height:100vh;min-height:100svh;overflow-x:hidden}
.app{width:min(100%,980px);margin:0 auto;min-height:100vh;min-height:100svh;
  padding:clamp(14px,3vw,28px);display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;align-items:center;gap:16px;animation:fadeUp .4s ease;text-align:center;flex:1;justify-content:center}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
h1{font-size:clamp(28px,6.5vw,48px);margin:0;color:#d83b19;text-shadow:2px 2px 0 #ffd23f}
.sub{font-size:clamp(15px,4vw,19px);color:#58627a;line-height:1.7;margin:0;max-width:36em}
.hero{font-size:clamp(56px,14vw,96px);animation:wiggle 2.4s ease-in-out infinite}
@keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.panel{background:#fff;border:3px solid #16213e;border-radius:20px;padding:clamp(18px,4vw,28px);
  width:min(100%,560px);box-shadow:6px 6px 0 rgba(22,33,62,.9)}
.howto{text-align:left;line-height:2;font-size:16px;color:#16213e}
.howto b{color:#d83b19}
.bigbtn{font-size:21px;font-weight:900;padding:16px 40px;border:3px solid #16213e;border-radius:16px;cursor:pointer;
  background:#ffd23f;color:#16213e;box-shadow:4px 4px 0 #16213e;transition:.12s;margin-top:8px}
.bigbtn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #16213e}
.bigbtn:disabled{opacity:.5}
/* game */
.topbar{width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between}
.round{font-size:19px;font-weight:900;background:#16213e;color:#fff;border-radius:30px;padding:8px 20px}
.score{font-size:19px;font-weight:900;color:#d83b19}
.timerwrap{width:100%;height:16px;background:#fff;border:3px solid #16213e;border-radius:12px;overflow:hidden}
.timerbar{height:100%;width:100%;background:linear-gradient(90deg,#168a58,#7bc96f);transition:width 1s linear}
.timerbar.low{background:linear-gradient(90deg,#d8374e,#ff7b8d)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,3vw,22px);width:100%}
.pick{position:relative;border:4px solid #16213e;border-radius:18px;overflow:hidden;cursor:pointer;background:#fff;
  box-shadow:4px 4px 0 rgba(22,33,62,.9);transition:transform .12s}
.pick:active{transform:scale(.97)}
.pick img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;pointer-events:none}
.pick .tag{position:absolute;top:10px;left:10px;background:#16213e;color:#fff;font-weight:900;font-size:20px;
  width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.pick.correct{border-color:#168a58;box-shadow:0 0 0 5px #168a58,4px 4px 0 rgba(22,33,62,.9)}
.pick.wrong{border-color:#d8374e;box-shadow:0 0 0 5px #d8374e,4px 4px 0 rgba(22,33,62,.9)}
.pick.dim{opacity:.55}
.badge{position:absolute;inset:auto 0 0 0;padding:10px;font-weight:900;font-size:17px;color:#fff}
.badge.ok{background:rgba(22,138,88,.92)}
.badge.no{background:rgba(216,55,78,.92)}
.badge.ai{background:rgba(38,120,217,.92)}
.q-subject{font-size:15px;color:#58627a;font-weight:700}
/* result */
.stars{font-size:52px}
.rscore{font-size:clamp(40px,10vw,64px);font-weight:900;color:#d83b19;margin:0}
.rank-list{width:100%;text-align:left;margin:0;padding:0;list-style:none}
.rank-list li{background:#fff8e8;border:2px solid #16213e;border-radius:12px;padding:10px 16px;margin:8px 0;
  font-size:17px;font-weight:700;display:flex;justify-content:space-between}
.rank-list li.me{background:#ffd23f}
input[type=text]{font-size:18px;padding:12px 16px;border-radius:12px;border:3px solid #16213e;width:100%;outline:none}
.namerow{display:flex;gap:8px;width:100%}
.namerow .bigbtn{margin-top:0;padding:12px 20px;font-size:17px;white-space:nowrap}
.tier-msg{font-size:18px;font-weight:700;color:#16213e;line-height:1.7}
.hint{font-size:13px;color:#58627a}
</style>
</head>
<body>
<div class="app">

  <section id="scr-start" class="screen active">
    <div class="hero">🕵️</div>
    <h1>AI 진짜? 가짜? 퀴즈</h1>
    <p class="sub">두 장의 사진이 나와.<br>한 장은 <b>진짜 카메라로 찍은 사진</b>, 다른 한 장은 <b>AI가 만든 가짜</b>야.<br>가짜를 골라봐!</p>
    <div class="panel">
      <div class="howto">
        🖼️ 총 <b>10문제</b> — 50쌍 중에서 매번 랜덤 출제!<br>
        ⏱️ 문제당 <b>15초</b> — 빨리 맞힐수록 보너스!<br>
        🏆 <b>TOP 5 랭킹</b>에 도전해봐
      </div>
    </div>
    <button class="bigbtn" id="btn-start">게임 시작 🚀</button>
    <p class="hint">※ 사진은 두 장 다 그럴싸하게 생겼으니 눈 크게 뜨고!</p>
  </section>

  <section id="scr-game" class="screen" style="justify-content:flex-start">
    <div class="topbar">
      <div class="round" id="round">1/10</div>
      <div class="score" id="score">0점</div>
    </div>
    <div class="timerwrap"><div class="timerbar" id="timerbar"></div></div>
    <p class="q-subject" id="q-subject"></p>
    <div class="duo" id="duo"></div>
    <p class="hint" id="game-hint">AI가 만든 가짜 사진을 골라 눌러!</p>
  </section>

  <section id="scr-result" class="screen">
    <div class="stars" id="stars-emoji">🏆</div>
    <h1>결과 발표!</h1>
    <p class="rscore" id="rscore">0점</p>
    <p class="tier-msg" id="tier-msg"></p>
    <div class="panel" id="rank-panel" style="display:none">
      <div class="namerow">
        <input type="text" id="rname" placeholder="이름 (랭킹 등록)" maxlength="10" autocomplete="off" />
        <button class="bigbtn" id="btn-save">등록</button>
      </div>
      <ol class="rank-list" id="rank-list" style="margin-top:14px"></ol>
    </div>
    <button class="bigbtn" id="btn-retry">다시 하기 🔄</button>
  </section>

</div>
<script>
"use strict";
const PAIRS=[{s:"🐱 고양이", ai:"img/8d3e0c152f.jpg", real:"img/d887deabac.jpg"},
 {s:"🐶 강아지", ai:"img/db3a9a6bdc.jpg", real:"img/5890a55f21.jpg"},
 {s:"🍔 햄버거", ai:"img/21d997c20b.jpg", real:"img/2a1c9f8b35.jpg"},
 {s:"🍕 피자", ai:"img/eeaaa90ab4.jpg", real:"img/7fc7d8a8db.jpg"},
 {s:"🌹 장미", ai:"img/13e8616ea9.jpg", real:"img/5622a3ffb9.jpg"},
 {s:"🏔️ 설산", ai:"img/5d68905895.jpg", real:"img/e59603b2a0.jpg"},

 {s:"🦜 앵무새", ai:"img/00f8587504.jpg", real:"img/b0e8e3f41e.jpg"},
 {s:"🐰 토끼", ai:"img/529babe2a5.jpg", real:"img/7e22a7b83e.jpg"},
 {s:"🐴 말", ai:"img/2a459bbda6.jpg", real:"img/45aad295f7.jpg"},
 {s:"🐧 펭귄", ai:"img/e21cd22995.jpg", real:"img/b1971fe029.jpg"},
 {s:"🦁 사자", ai:"img/f0935ba8ba.jpg", real:"img/076beeac11.jpg"},
 {s:"🐘 코끼리", ai:"img/e03ff1b10b.jpg", real:"img/8f37f68255.jpg"},

 {s:"🦊 여우", ai:"img/0d6b93220d.jpg", real:"img/62442a298d.jpg"},

 {s:"☁️ 뭉게구름", ai:"img/d613a9d067.jpg", real:"img/c8d4453580.jpg"},

 {s:"✈️ 비행기", ai:"img/1cbc9aad3f.jpg", real:"img/09e4ea3036.jpg"},
 {s:"🗼 에펠탑", ai:"img/1e388de21c.jpg", real:"img/9219242037.jpg"},
 {s:"🎈 열기구", ai:"img/de03f32f21.jpg", real:"img/8f09e27401.jpg"},
 {s:"🏰 성", ai:"img/dc127392ce.jpg", real:"img/98e1400c9e.jpg"},
 {s:"🌬️ 풍차", ai:"img/a7deb02a20.jpg", real:"img/cd0f497afa.jpg"},
 {s:"⛵ 요트", ai:"img/cfc1261a9e.jpg", real:"img/e1146c9f59.jpg"},
 {s:"🏍️ 오토바이", ai:"img/3c75128814.jpg", real:"img/76c62278ce.jpg"},
 {s:"🚁 헬리콥터", ai:"img/aec813a6e3.jpg", real:"img/b9e77f6263.jpg"},
 {s:"🎡 관람차", ai:"img/05814a3e24.jpg", real:"img/e8067517f2.jpg"},
 {s:"🍇 포도", ai:"img/8535dfe21b.jpg", real:"img/3a263c1e72.jpg"}];
const TIME_LIMIT=15;
let order=[],qi=0,score=0,correctCount=0,timerId=null,timeLeft=0,locked=false;
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

$('btn-start').addEventListener('click',()=>{
  order=shuffle([...Array(PAIRS.length).keys()]).slice(0,10);
  qi=0;score=0;correctCount=0;
  preload();
  show('scr-game');nextQ();
});

// 이번 판 10문제 사진을 미리 받아두기 (이미지가 파일로 분리돼 있음)
function preload(){order.forEach(i=>{[PAIRS[i].ai,PAIRS[i].real].forEach(src=>{const im=new Image();im.src=src;});});}
function imgReady(img){return img.complete?Promise.resolve():new Promise(r=>{img.onload=img.onerror=r;});}

function nextQ(){
  if(qi>=order.length){showResult();return;}
  locked=false;
  const p=PAIRS[order[qi]];
  $('round').textContent=(qi+1)+'/'+order.length;
  $('score').textContent=score+'점';
  $('q-subject').textContent='주제: '+p.s;
  $('game-hint').textContent='AI가 만든 가짜 사진을 골라 눌러!';
  const aiFirst=Math.random()<.5;
  const duo=$('duo');duo.innerHTML='';
  [['A',aiFirst?p.ai:p.real,aiFirst],['B',aiFirst?p.real:p.ai,!aiFirst]].forEach(([tag,src,isAI])=>{
    const d=document.createElement('div');d.className='pick';d.dataset.ai=isAI?'1':'0';
    d.innerHTML='<div class="tag">'+tag+'</div><img src="'+src+'" alt="quiz image" draggable="false"/>';
    d.addEventListener('click',()=>answer(d));
    duo.appendChild(d);
  });
  // 타이머: 두 사진이 다 뜬 뒤에 시작
  const myQ=qi;
  timeLeft=TIME_LIMIT;
  $('timerbar').style.transition='none';$('timerbar').style.width='100%';
  clearInterval(timerId);
  Promise.all([...duo.querySelectorAll('img')].map(imgReady)).then(()=>{if(qi===myQ&&!locked)startTimer();});
}

function startTimer(){
  const bar=$('timerbar');bar.style.transition='none';bar.style.width='100%';bar.classList.remove('low');
  void bar.offsetWidth;bar.style.transition='width 1s linear';
  clearInterval(timerId);
  timerId=setInterval(()=>{
    timeLeft--;
    bar.style.width=(timeLeft/TIME_LIMIT*100)+'%';
    if(timeLeft<=5)bar.classList.add('low');
    if(timeLeft<=0){clearInterval(timerId);answer(null);}
  },1000);
}

function answer(el){
  if(locked)return;locked=true;
  clearInterval(timerId);
  const picks=[...document.querySelectorAll('#duo .pick')];
  const aiEl=picks.find(d=>d.dataset.ai==='1');
  let good=false;
  if(el&&el.dataset.ai==='1'){
    good=true;correctCount++;
    const bonus=100+timeLeft*5;
    score+=bonus;
    $('game-hint').textContent='정답! +'+bonus+'점 🎉';
  }else{
    $('game-hint').textContent=el?'땡! 가짜는 다른 쪽이었어 😅':'시간 초과! ⏰';
  }
  picks.forEach(d=>{
    d.style.pointerEvents='none';
    const isAI=d.dataset.ai==='1';
    if(isAI){d.classList.add('correct');d.insertAdjacentHTML('beforeend','<div class="badge ok">🤖 AI 가짜!</div>');}
    else if(d===el){d.classList.add('wrong');d.insertAdjacentHTML('beforeend','<div class="badge no">📷 진짜 사진</div>');}
    else{d.classList.add('dim');}
  });
  $('score').textContent=score+'점';
  setTimeout(()=>{qi++;nextQ();},1900);
}

function tierMsg(){
  if(correctCount>=9)return "🤖❌ AI 판별 마스터! 넌 AI보다 눈이 매워. AI 제작반 스카우트 대상이야.";
  if(correctCount>=7)return "🔍 훌륭해! 웬만한 가짜는 다 잡아내는 탐정 눈이야.";
  if(correctCount>=5)return "🙂 절반 성공! AI가 점점 진짜처럼 만들고 있다는 증거야.";
  if(correctCount>=3)return "😅 쉽지 않지? AI 가짜가 진짜보다 더 진짜 같을 때가 있어.";
  return "🤯 완전 속았지? 그게 바로 요즘 AI야. 다시 도전해봐!";
}

function getRanks(){try{return JSON.parse(localStorage.getItem('aiquiz_rank')||'[]');}catch(e){return[];}}
function setRanks(r){try{localStorage.setItem('aiquiz_rank',JSON.stringify(r.slice(0,5)));}catch(e){}}

function showResult(){
  show('scr-result');
  const max=order.length*(100+TIME_LIMIT*5);
  $('rscore').textContent=score+'점';
  $('stars-emoji').textContent=correctCount>=9?'🏆':correctCount>=7?'🥈':correctCount>=5?'🥉':'🕵️';
  $('tier-msg').textContent=correctCount+'/'+order.length+'개 정답 — '+tierMsg();
  const panel=$('rank-panel');panel.style.display='block';
  const list=$('rank-list');list.innerHTML='';
  const ranks=getRanks();
  const render=(me)=>{
    list.innerHTML='';
    ranks.forEach((r,i)=>{
      const li=document.createElement('li');
      if(me&&r.name===me.name&&r.score===me.score)li.className='me';
      li.innerHTML='<span>'+(i+1)+'. '+escapeHtml(r.name)+'</span><span>'+r.score+'점</span>';
      list.appendChild(li);
    });
    if(!ranks.length)list.innerHTML='<li><span>아직 기록이 없어. 첫 주인공이 돼봐!</span><span></span></li>';
  };
  render(null);
  $('btn-save').onclick=()=>{
    const name=($('rname').value.trim()||'익명').slice(0,10);
    const me={name:name,score:score};
    ranks.push(me);ranks.sort((a,b)=>b.score-a.score);setRanks(ranks);
    $('rname').value='';$('rname').disabled=true;$('btn-save').disabled=true;
    render(me);
  };
  $('rname').disabled=false;$('btn-save').disabled=false;
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
$('btn-retry').addEventListener('click',()=>{
  order=shuffle([...Array(PAIRS.length).keys()]).slice(0,10);
  qi=0;score=0;correctCount=0;
  preload();
  show('scr-game');nextQ();
});
</script>
