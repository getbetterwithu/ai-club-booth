<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0620" />
<link rel="icon" href="data:," />
<title>AI 타로 운세</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  background:radial-gradient(1200px 800px at 50% -10%,#241458 0%,#120a33 45%,#070413 100%);
  color:#f5eedd;min-height:100vh;min-height:100svh;overflow-x:hidden;
}
#stars{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.app{position:relative;z-index:1;width:min(100%,920px);margin:0 auto;min-height:100vh;min-height:100svh;
  padding:clamp(16px,4vw,36px);display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;align-items:center;gap:18px;animation:fadeUp .5s ease;text-align:center}
.screen.active{display:flex}
@keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
h1{font-size:clamp(30px,7vw,52px);margin:6px 0 0;letter-spacing:2px;
  background:linear-gradient(180deg,#ffe9a8,#e8a93d);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 40px rgba(232,169,61,.25)}
.sub{color:#cfc3ee;font-size:clamp(14px,3.6vw,18px);margin:0;max-width:34em;line-height:1.7}
.moon{font-size:clamp(40px,10vw,72px);filter:drop-shadow(0 0 18px rgba(245,200,110,.6));animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.card-panel{background:rgba(20,12,48,.72);border:1px solid rgba(232,169,61,.35);border-radius:20px;
  padding:clamp(18px,4vw,30px);width:min(100%,560px);box-shadow:0 10px 40px rgba(0,0,0,.5);backdrop-filter:blur(6px)}
label.lbl{display:block;text-align:left;color:#e8d9ae;font-weight:700;margin:14px 0 8px;font-size:15px}
input[type=text],input[type=email]{width:100%;font-size:18px;padding:14px 16px;border-radius:14px;border:2px solid rgba(232,169,61,.4);
  background:#0d0824;color:#fff;outline:none}
input[type=text]:focus,input[type=email]:focus{border-color:#e8a93d;box-shadow:0 0 0 4px rgba(232,169,61,.2)}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.cat{border:2px solid rgba(232,169,61,.35);background:rgba(255,255,255,.04);color:#f5eedd;border-radius:14px;
  padding:14px 8px;font-size:17px;font-weight:700;cursor:pointer;transition:.15s}
.cat small{display:block;font-weight:400;color:#bfaee0;font-size:12px;margin-top:4px}
.cat.sel{border-color:#ffd97a;background:rgba(232,169,61,.18);box-shadow:0 0 18px rgba(232,169,61,.35);transform:scale(1.03)}
.bigbtn{margin-top:18px;width:100%;font-size:20px;font-weight:800;padding:16px;border:none;border-radius:16px;cursor:pointer;
  color:#241203;background:linear-gradient(180deg,#ffe9a8,#e8a93d);box-shadow:0 6px 24px rgba(232,169,61,.4);transition:.15s}
.bigbtn:active{transform:scale(.97)}
.bigbtn:disabled{opacity:.45;cursor:default;box-shadow:none}
.ghostbtn{background:transparent;border:2px solid rgba(232,169,61,.5);color:#ffe9a8;border-radius:14px;
  padding:12px 22px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
/* ---- tarot cards ---- */
.tcard{width:var(--cw,150px);height:calc(var(--cw,150px)*1.55);border-radius:14px;position:relative;
  transform-style:preserve-3d;transition:transform .7s cubic-bezier(.2,.7,.3,1.2);cursor:pointer;flex:0 0 auto}
.tcard .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;overflow:hidden}
.tcard .back{background:linear-gradient(150deg,#2a1658,#160b36);border:2px solid #e8a93d;
  box-shadow:0 8px 22px rgba(0,0,0,.55),inset 0 0 0 6px #160b36,inset 0 0 0 8px rgba(232,169,61,.55)}
.tcard .back::before{content:"🌙";font-size:44px;filter:drop-shadow(0 0 10px rgba(255,220,130,.8))}
.tcard .back::after{content:"✦ ✦ ✦";color:rgba(232,169,61,.7);font-size:12px;letter-spacing:4px}
.tcard .front{transform:rotateY(180deg);border:2px solid #ffd97a;color:#fff;
  background:linear-gradient(160deg,hsl(var(--hue),60%,38%),hsl(calc(var(--hue) + 30),65%,18%));
  box-shadow:0 8px 26px rgba(0,0,0,.6),0 0 24px hsla(var(--hue),80%,60%,.35)}
.tcard.flipped{transform:rotateY(180deg)}
.tcard .num{font-size:11px;letter-spacing:3px;color:#ffe9a8;opacity:.9}
.tcard .sym{font-size:46px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.5))}
.tcard .nm{font-size:16px;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.tcard .en{font-size:10px;opacity:.75;letter-spacing:1px}
/* shuffle */
.deck{position:relative;width:170px;height:264px;margin:20px auto}
.deck .tcard{position:absolute;inset:0;--cw:170px;cursor:default;animation:shuf 1.6s ease-in-out infinite}
.deck .tcard:nth-child(2){animation-delay:.12s}.deck .tcard:nth-child(3){animation-delay:.24s}
.deck .tcard:nth-child(4){animation-delay:.36s}.deck .tcard:nth-child(5){animation-delay:.48s}
@keyframes shuf{0%,100%{transform:translateX(0) rotate(0)}25%{transform:translateX(-34px) rotate(-8deg)}75%{transform:translateX(34px) rotate(8deg)}}
.shuf-txt{color:#e8d9ae;font-size:18px;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.6}50%{opacity:1}}
/* pick */
.pick-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(8px,2.5vw,18px);justify-items:center;margin-top:6px}
.pick-grid .tcard{--cw:clamp(96px,26vw,150px)}
.pick-grid .tcard.picked{outline:3px solid #ffd97a;outline-offset:4px;box-shadow:0 0 26px rgba(255,217,122,.7)}
.pick-tag{position:absolute;top:-14px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#ffe9a8,#e8a93d);
  color:#241203;font-size:12px;font-weight:800;padding:3px 12px;border-radius:20px;white-space:nowrap;z-index:2}
/* reveal */
.reveal-row{display:flex;gap:clamp(10px,3vw,24px);justify-content:center;flex-wrap:wrap}
.reveal-row .tcard{--cw:clamp(110px,28vw,170px)}
.meaning{max-width:560px;background:rgba(20,12,48,.72);border:1px solid rgba(232,169,61,.35);border-radius:16px;
  padding:16px 20px;text-align:left;animation:fadeUp .5s ease}
.meaning h3{margin:0 0 6px;color:#ffd97a;font-size:18px}
.meaning p{margin:6px 0;line-height:1.75;color:#efe6d2;font-size:15.5px}
.meaning .kw{color:#bfaee0;font-size:13px}
/* result */
.score-ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;margin:6px auto;
  background:conic-gradient(#ffd97a var(--p,0%),rgba(255,255,255,.12) 0);position:relative}
.score-ring::before{content:"";position:absolute;inset:12px;border-radius:50%;background:#120a33}
.score-num{position:relative;font-size:40px;font-weight:900;color:#ffe9a8}
.score-lbl{position:relative;font-size:12px;color:#bfaee0;margin-top:-6px}
.result-cards{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.result-cards .tcard{--cw:104px;cursor:default}
.lucky{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.lucky div{background:rgba(232,169,61,.12);border:1px solid rgba(232,169,61,.4);border-radius:12px;padding:10px 16px;font-size:15px}
.lucky b{color:#ffd97a}
.final-msg{max-width:600px;background:rgba(20,12,48,.72);border:1px solid rgba(232,169,61,.35);border-radius:16px;
  padding:20px 22px;text-align:left;line-height:1.9;font-size:16px;color:#f2ead6}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.sparkle{position:fixed;pointer-events:none;z-index:5;font-size:22px;animation:sparkFly 1.4s ease-out forwards}
@keyframes sparkFly{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(.4) rotate(40deg)}}
.hint{color:#9d8fc7;font-size:13px}
@media (max-width:560px){ .cats{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="app">

  <!-- 시작 -->
  <section id="scr-start" class="screen active">
    <div class="moon">🔮</div>
    <h1>AI 타로 운세</h1>
    <p class="sub">밤하늘의 별들이 네 운명을 속삭여줄 거야.<br>과거 · 현재 · 미래, 세 장의 카드가 답을 알려줘.</p>
    <div class="card-panel">
      <label class="lbl" for="uname">이름을 알려줘</label>
      <input type="text" id="uname" placeholder="예: 김별" maxlength="12" autocomplete="off" />
      <label class="lbl">요즘 가장 고민되는 건?</label>
      <div class="cats" id="cats">
        <button class="cat" data-c="학업">📚 학업<small>시험 · 성적 · 공부</small></button>
        <button class="cat" data-c="친구">🧑‍🤝‍🧑 친구<small>관계 · 오해 · 우정</small></button>
        <button class="cat" data-c="사랑">💘 사랑<small>짝사랑 · 썸 · 고백</small></button>
        <button class="cat" data-c="진로">🧭 진로<small>꿈 · 장래희망</small></button>
      </div>
      <button class="bigbtn" id="btn-start" disabled>운명의 카드 섞기 ✨</button>
    </div>
  </section>

  <!-- 섞기 -->
  <section id="scr-shuffle" class="screen">
    <h1 style="font-size:clamp(24px,5vw,36px)">카드를 섞는 중...</h1>
    <div class="deck" id="deck"></div>
    <p class="shuf-txt">별들이 너의 기운을 읽고 있어 🔮</p>
  </section>

  <!-- 고르기 -->
  <section id="scr-pick" class="screen">
    <h1 style="font-size:clamp(24px,5vw,36px)">카드 3장을 골라줘</h1>
    <p class="sub">마음이 끌리는 카드를 순서대로 3장 눌러봐.<br>첫 번째는 <b style="color:#ffd97a">과거</b>, 두 번째는 <b style="color:#ffd97a">현재</b>, 세 번째는 <b style="color:#ffd97a">미래</b>야.</p>
    <div class="pick-grid" id="pick-grid"></div>
    <button class="bigbtn" id="btn-toreveal" style="max-width:420px" disabled>운명 확인하기 🔮</button>
  </section>

  <!-- 뒤집기 -->
  <section id="scr-reveal" class="screen">
    <h1 style="font-size:clamp(24px,5vw,36px)">카드 뒤집기</h1>
    <p class="sub">카드를 눌러 한 장씩 뒤집어봐.</p>
    <div class="reveal-row" id="reveal-row"></div>
    <div class="meaning" id="meaning" style="display:none"></div>
    <button class="bigbtn" id="btn-toresult" style="max-width:420px;display:none">최종 운세 보기 ✨</button>
  </section>

  <!-- 결과 -->
  <section id="scr-result" class="screen">
    <div class="moon">🌟</div>
    <h1 id="res-title" style="font-size:clamp(24px,5.5vw,40px)">너의 운세</h1>
    <div class="score-ring" id="score-ring"><div><div class="score-num" id="score-num">0</div><div class="score-lbl">운세 점수</div></div></div>
    <div class="result-cards" id="result-cards"></div>
    <div class="final-msg" id="final-msg"></div>
    <div class="lucky" id="lucky"></div>
    <div class="btnrow">
      <button class="bigbtn" id="btn-retry" style="width:auto;padding:14px 34px">다시 뽑기 🔄</button>
      <button class="ghostbtn" id="btn-home">처음으로</button>
    </div>
    <div class="card-panel" style="width:min(100%,560px)">
      <label class="lbl">📧 이메일로 결과 받기</label>
      <div style="display:flex;gap:8px">
        <input type="email" id="email" placeholder="이메일 주소 입력" autocomplete="off" style="flex:1;min-width:0" />
        <button class="bigbtn" id="btn-email" style="width:auto;margin-top:0;padding:14px 20px;font-size:16px;white-space:nowrap">보내기</button>
      </div>
      <p class="hint" style="text-align:left;margin:8px 0 0">보내기를 누르면 메일 앱이 열려요. 받는 주소가 자동으로 들어가니 전송만 누르세요.</p>
    </div>
    <p class="hint">결과 화면을 캡처해서 친구에게 공유해봐 📸</p>
  </section>

</div>
<script>
"use strict";
/* ============ 별 배경 ============ */
const cv=document.getElementById('stars'),cx=cv.getContext('2d');let stars=[];
function initStars(){cv.width=innerWidth;cv.height=innerHeight;stars=[];
  for(let i=0;i<160;i++)stars.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:Math.random()*1.6+.3,p:Math.random()*6.28,s:.5+Math.random()*1.5});}
initStars();addEventListener('resize',initStars);
(function loop(t){cx.clearRect(0,0,cv.width,cv.height);
  for(const s of stars){const a=.35+.65*Math.abs(Math.sin(t/900*s.s+s.p));
    cx.globalAlpha=a;cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x,s.y,s.r,0,6.29);cx.fill();}
  cx.globalAlpha=1;requestAnimationFrame(loop);})(0);
setInterval(()=>{ // 가끔 별똥별
  if(Math.random()<.5)return;const el=document.createElement('div');el.textContent='☄️';
  el.style.cssText=`position:fixed;top:${Math.random()*30}%;left:${60+Math.random()*35}%;font-size:26px;z-index:1;pointer-events:none;transition:all 1.1s linear;`;
  document.body.appendChild(el);requestAnimationFrame(()=>{el.style.transform='translate(-40vw,22vh)';el.style.opacity='0';});
  setTimeout(()=>el.remove(),1200);
},7000);

/* ============ 카드 데이터 (메이저 아르카나 22장) ============ */
const CARDS=[
{n:"바보",en:"THE FOOL",num:"0",sym:"🎒",hue:35,kw:["새로운 시작","모험","순수함"],sc:78,
 msg:"아무것도 모른 채 떠나는 여행자가 가장 멀리 가. 지금 네 앞엔 백지가 아니라 새 스케치북이 놓여 있어. 서툴러도 괜찮아. 첫 발을 떼는 용기가 이미 절반이야.",
 f:{학업:"새로운 공부법이나 과목에 도전해봐. 처음이라 서툴러도 돼.",친구:"새 친구에게 먼저 말 걸어봐. 의외로 잘 통할 거야.",사랑:"설렘을 숨기지 마. 순수한 마음이 통하는 시기야.",진로:"정해진 길 말고, 네가 진짜 궁금한 걸 따라가 봐."}},
{n:"마법사",en:"THE MAGICIAN",num:"I",sym:"🎩",hue:265,kw:["재능","가능성","실행력"],sc:88,
 msg:"마법사의 테이블 위엔 이미 모든 도구가 놓여 있어. 너도 마찬가지야. 필요한 건 다 갖고 있으니, 이제 꺼내 쓸 차례야.",
 f:{학업:"아는 걸 써먹을 때야. 배운 걸 직접 설명해보면 실력이 확 올라.",친구:"네 장점을 보여줘. 먼저 도와주면 관계가 깊어져.",사랑:"매력을 숨기지 마. 자신감 있는 네가 제일 빛나.",진로:"네 재능 목록을 적어봐. 의외의 길이 보일 거야."}},
{n:"여사제",en:"THE HIGH PRIESTESS",num:"II",sym:"🌙",hue:230,kw:["직관","내면의 목소리","신중함"],sc:75,
 msg:"시끄러운 세상에서 답은 조용한 곳에 있어. 자다가 문득 떠오른 생각, 그게 진짜 답일 때가 많아. 오늘은 네 직감을 믿어봐.",
 f:{학업:"'왠지 이거' 싶은 감을 믿어봐. 직관이 맞을 때가 많아.",친구:"친구의 말 뒤에 숨은 마음을 읽어봐.",사랑:"상대 마음을 너무 분석하지 마. 느낌을 믿어.",진로:"남들 말보다 네 마음이 끌리는 쪽을 봐."}},
{n:"여제",en:"THE EMPRESS",num:"III",sym:"🌷",hue:320,kw:["풍요","성장","따뜻함"],sc:85,
 msg:"봄밭처럼 모든 게 무럭무럭 자라는 시기야. 네가 정성 들인 것들이 결실을 맺을 거야. 주변에 따뜻하게 대해줘, 그게 그대로 돌아와.",
 f:{학업:"꾸준히 해온 게 점수로 나타날 때야.",친구:"따뜻하게 대하면 관계가 깊어져.",사랑:"마음을 표현해봐. 풍성한 감정이 통할 거야.",진로:"네가 키운 재능이 빛을 볼 시기야."}},
{n:"황제",en:"THE EMPEROR",num:"IV",sym:"🏰",hue:20,kw:["안정","리더십","책임"],sc:80,
 msg:"흔들리지 않는 중심이 필요해. 네가 반의 기둥이 될 수 있어. 규칙을 만들고 지키는 사람이 결국 판을 주도해.",
 f:{학업:"계획표를 짜고 지켜봐. 루틴이 성적을 만들어.",친구:"모임을 이끌어봐. 네가 중심이 되면 돼.",사랑:"밀당 말고 진지하게. 안정감이 매력이야.",진로:"장기 계획을 세워봐. 큰 그림이 필요해."}},
{n:"교황",en:"THE HIEROPHANT",num:"V",sym:"📿",hue:45,kw:["조언","멘토","지혜"],sc:72,
 msg:"혼자 끙끙대지 마. 이미 그 길을 가본 어른이 근처에 있어. 선생님이나 부모님께 물어보는 게 제일 빠른 지름길이야.",
 f:{학업:"선생님께 질문해봐. 5분 상담이 5시간 독학보다 나아.",친구:"어른의 조언이 친구 문제를 풀어줄 거야.",사랑:"연애 고민은 경험자에게. 혼자 끙끙대지 마.",진로:"그 직업 하는 사람을 직접 만나봐."}},
{n:"연인",en:"THE LOVERS",num:"VI",sym:"💞",hue:340,kw:["선택","관계","진심"],sc:83,
 msg:"갈림길 앞에 섰어. 머리로 재지 말고 가슴이 뛰는 쪽을 골라. 진심으로 고른 선택은 후회가 적어.",

const LUCKY_COLOR=["🌟 별빛 골드","🌙 달빛 실버","💜 신비 퍼플","💙 깊은 바다 블루","❤️ 열정 레드","💚 행운 그린","🩷 설렘 핑크","🧡 에너지 오렌지"];
const LUCKY_ITEM=["🔮 수정 구슬","🕯️ 향초","📿 부적","🍀 네잎클로버","🔑 작은 열쇠","🎧 최애 플레이리스트","📓 다이어리","🧸 애착 인형"];
const POS=["과거","현재","미래"];
const POS_DESC=["지나온 길 — 지금까지의 흐름","지금 네 상태 — 현재의 기운","앞으로 펼쳐질 일 — 다가올 미래"];

/* ============ 상태 ============ */
let uname="",cat="",picked=[],revealed=0,lastMailText="";
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active');window.scrollTo(0,0);}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function sparkleBurst(){for(let i=0;i<14;i++){const s=document.createElement('div');s.className='sparkle';
  s.textContent=['✨','🌟','💫','⭐'][i%4];s.style.left=(20+Math.random()*60)+'vw';s.style.top=(30+Math.random()*40)+'vh';
  document.body.appendChild(s);setTimeout(()=>s.remove(),1500);}}

/* ============ 시작 화면 ============ */
document.querySelectorAll('#cats .cat').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#cats .cat').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  cat=b.dataset.c;$('btn-start').disabled=!($('uname').value.trim()&&cat);}));
$('uname').addEventListener('input',()=>{$('btn-start').disabled=!($('uname').value.trim()&&cat);});
$('btn-start').addEventListener('click',()=>{
  uname=$('uname').value.trim();if(!uname||!cat)return;
  const deck=$('deck');deck.innerHTML='';
  for(let i=0;i<5;i++){const d=document.createElement('div');d.className='tcard';d.innerHTML='<div class="face back"></div>';deck.appendChild(d);}
  show('scr-shuffle');
  setTimeout(setupPick,2100);
});

/* ============ 카드 고르기 ============ */
function setupPick(){
  picked=[];revealed=0;
  const idxs=shuffle([...Array(CARDS.length).keys()]).slice(0,9);
  const g=$('pick-grid');g.innerHTML='';
  idxs.forEach(ci=>{
    const d=document.createElement('div');d.className='tcard';d.dataset.ci=ci;
    d.innerHTML='<div class="face back"></div>';
    d.addEventListener('click',()=>{
      if(d.classList.contains('picked'))return;
      if(picked.length>=3)return;
      picked.push(ci);d.classList.add('picked');
      const tag=document.createElement('div');tag.className='pick-tag';tag.textContent=POS[picked.length-1];d.appendChild(tag);
      sparkleBurst();
      if(picked.length===3)$('btn-toreveal').disabled=false;
    });
    g.appendChild(d);
  });
  $('btn-toreveal').disabled=true;
  show('scr-pick');
}
$('btn-toreveal').addEventListener('click',setupReveal);

/* ============ 뒤집기 ============ */
function setupReveal(){
  const row=$('reveal-row');row.innerHTML='';revealed=0;
  $('meaning').style.display='none';$('btn-toresult').style.display='none';
  picked.forEach((ci,k)=>{
    const c=CARDS[ci];
    const d=document.createElement('div');d.className='tcard';d.style.setProperty('--hue',c.hue);
    d.innerHTML='<div class="face back"></div>'+
      '<div class="face front"><div class="num">'+c.num+' · '+POS[k]+'</div><div class="sym">'+c.sym+'</div>'+
      '<div class="nm">'+c.n+'</div><div class="en">'+c.en+'</div></div>';
    d.addEventListener('click',()=>{
      if(d.classList.contains('flipped'))return;
      d.classList.add('flipped');sparkleBurst();
      const m=$('meaning');m.style.display='block';
      m.innerHTML='<h3>'+POS[revealed]+' — '+c.sym+' '+c.n+' <span class="kw">'+c.kw.join(' · ')+'</span></h3><p>'+c.msg+'</p>';
      revealed++;
      if(revealed===3)$('btn-toresult').style.display='block';
    });
    row.appendChild(d);
  });
  show('scr-reveal');
}
$('btn-toresult').addEventListener('click',showResult);

/* ============ 결과 ============ */
function showResult(){
  const cards=picked.map(ci=>CARDS[ci]);
  const avg=Math.round(cards.reduce((a,c)=>a+c.sc,0)/3);
  $('res-title').textContent=uname+'의 '+cat+' 운세';
  const ring=$('score-ring'),num=$('score-num');let p=0;
  ring.style.setProperty('--p','0%');num.textContent='0';
  const iv=setInterval(()=>{p+=2;if(p>=avg){p=avg;clearInterval(iv);}ring.style.setProperty('--p',p+'%');num.textContent=p;},24);
  const rc=$('result-cards');rc.innerHTML='';
  cards.forEach((c,k)=>{const d=document.createElement('div');d.className='tcard flipped';d.style.setProperty('--hue',c.hue);
    d.innerHTML='<div class="face back"></div><div class="face front"><div class="num">'+c.num+' · '+POS[k]+'</div>'+
    '<div class="sym">'+c.sym+'</div><div class="nm">'+c.n+'</div></div>';rc.appendChild(d);});
  let tier,tierMsg;
  if(avg>=85){tier="🌟 대길";tierMsg="세 장의 카드가 전부 네 편이야. 지금은 뭘 해도 잘 풀리는 흐름이야. 망설였던 그 일, 이번 주 안에 질러봐.";}
  else if(avg>=70){tier="✨ 중길";tierMsg="전체적으로 좋은 흐름이야. 한두 가지 주의할 점만 챙기면 원하는 결과를 얻을 수 있어. 아래 카드별 조언을 체크해봐.";}
  else{tier="🌙 소길";tierMsg="지금은 잠깐 숨 고르는 시기야. 무리하게 밀어붙이기보다, 카드들의 조언대로 하나씩 정비하면 다음 기회가 훨씬 크게 와.";}
  let html='<p style="margin:0 0 10px;font-size:19px;font-weight:800;color:#ffd97a">'+tier+' — '+avg+'점</p><p style="margin:0 0 14px">'+tierMsg+'</p>';
  cards.forEach((c,k)=>{
    html+='<p style="margin:10px 0"><b style="color:#ffd97a">'+POS[k]+' · '+c.sym+' '+c.n+'</b> <span style="color:#bfaee0;font-size:13px">('+POS_DESC[k]+')</span><br>'+c.msg+'<br><span style="color:#ffe9a8">👉 '+cat+' 조언: '+c.f[cat]+'</span></p>';
  });
  $('final-msg').innerHTML=html;
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  const lc=pick(LUCKY_COLOR),li=pick(LUCKY_ITEM),ln=1+Math.floor(Math.random()*99);
  $('lucky').innerHTML='<div>🎨 행운의 색 <b>'+lc+'</b></div>'+
    '<div>🍀 행운의 아이템 <b>'+li+'</b></div>'+
    '<div>🔢 행운의 숫자 <b>'+ln+'</b></div>';
  lastMailText='🔮 '+uname+'의 '+cat+' 타로 운세\n운세 점수: '+avg+'점 ('+tier+')\n\n'+
    cards.map((c,k)=>'【'+POS[k]+'】 '+c.sym+' '+c.n+' ('+c.kw.join('/')+')\n'+c.msg+'\n👉 '+cat+' 조언: '+c.f[cat]).join('\n\n')+
    '\n\n🎨 행운의 색: '+lc+'\n🍀 행운의 아이템: '+li+'\n🔢 행운의 숫자: '+ln+'\n\n- AI 제작반 체험 부스 -';
  show('scr-result');sparkleBurst();
}
$('btn-retry').addEventListener('click',()=>{setupPick();});
$('btn-home').addEventListener('click',()=>{show('scr-start');});
$('btn-email').addEventListener('click',()=>{
  const em=$('email').value.trim();
  if(!em||em.indexOf('@')<0){alert('이메일 주소를 제대로 입력해줘!');return;}
  const subject=encodeURIComponent('🔮 '+uname+'의 타로 운세 결과');
  const body=encodeURIComponent(lastMailText);
  location.href='mailto:'+em+'?subject='+subject+'&body='+body;
});
